<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <rect width="1020" height="620" fill="#eef3f6"/>
  <text x="24" y="34" font-size="19" font-weight="800" fill="#0F2A43">연계 캔버스 렌더 개선안 — 중간 계층이 빈 경우 "직접 붙임"</text>
  <text x="24" y="56" font-size="12.5" fill="#64748B">잎(품목)을 대분류에 바로 이어붙일 때, 가짜 중간 노드를 만들지 않고 데이터 그대로 표시</text>

  <!-- ===== Panel A: 현재(문제) ===== -->
  <g>
    <rect x="24" y="78" width="470" height="470" rx="12" fill="#ffffff" stroke="#e6b0aa"/>
    <rect x="24" y="78" width="470" height="34" rx="12" fill="#fdecea"/>
    <text x="44" y="100" font-size="13.5" font-weight="800" fill="#b03a2e">✕ 현재 — 대분류 복제 / 품목이 소분류로</text>
    <!-- column headers -->
    <rect x="40" y="126" width="132" height="26" rx="7" fill="#0F2A43"/><text x="106" y="143" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">대분류</text>
    <rect x="182" y="126" width="132" height="26" rx="7" fill="#0F2A43"/><text x="248" y="143" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">중분류</text>
    <rect x="324" y="126" width="150" height="26" rx="7" fill="#8a2b22"/><text x="399" y="143" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">소분류 ⚠</text>
    <!-- connectors -->
    <path d="M172 190 C182 190 182 190 182 190" fill="none"/>
    <path d="M172 190 C200 190 164 190 182 190" fill="none" stroke="#9aa6b2" stroke-width="2"/>
    <path d="M172 190 L182 190" stroke="#9aa6b2" stroke-width="2"/>
    <path d="M314 190 L324 190" stroke="#9aa6b2" stroke-width="2"/>
    <!-- nodes -->
    <rect x="40" y="172" width="132" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="52" y="194" font-size="12.5" font-weight="700" fill="#0F2A43">경비</text>
    <rect x="182" y="172" width="132" height="36" rx="8" fill="#fff7f7" stroke="#f0a9a0" stroke-dasharray="4 3"/><text x="194" y="190" font-size="12" fill="#b03a2e">경비</text><text x="194" y="203" font-size="8.5" fill="#c96a5f">가짜(복제)</text>
    <rect x="324" y="172" width="150" height="36" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="336" y="190" font-size="12.5" fill="#0F2A43">이윤</text><text x="336" y="203" font-size="8.5" fill="#b03a2e">품목인데 소분류 자리</text>
    <!-- note -->
    <text x="44" y="250" font-size="11.5" fill="#8a2b22">· 빈 중/소 자리에 대분류 "경비"를 복제 → 가짜 노드</text>
    <text x="44" y="270" font-size="11.5" fill="#8a2b22">· 품목(이윤)이 잎이 아니라 "소분류"로 표기</text>
    <text x="44" y="290" font-size="11.5" fill="#8a2b22">· 비교·클러스터링에서 같은 분류명 중복 → 오작동 위험</text>

    <text x="44" y="330" font-size="11" fill="#64748B" font-style="italic">(깊은 항목은 정상: 재료비 &gt; 골조 &gt; 철근)</text>
  </g>

  <!-- ===== Panel B: 개선(직접 붙임) ===== -->
  <g>
    <rect x="526" y="78" width="470" height="470" rx="12" fill="#ffffff" stroke="#a9ddc0"/>
    <rect x="526" y="78" width="470" height="34" rx="12" fill="#eafaf1"/>
    <text x="546" y="100" font-size="13.5" font-weight="800" fill="#1e7d4f">✓ 개선 — 직접 붙임 (가짜 없음)</text>
    <!-- headers -->
    <rect x="542" y="126" width="132" height="26" rx="7" fill="#0F2A43"/><text x="608" y="143" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">대분류</text>
    <rect x="684" y="126" width="132" height="26" rx="7" fill="#0F2A43"/><text x="750" y="143" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">중분류</text>
    <rect x="826" y="126" width="150" height="26" rx="7" fill="#1C7293"/><text x="901" y="143" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">품명</text>

    <!-- direct connector: 경비 -> 이윤 (skips 중분류 col) -->
    <path d="M674 190 C760 190 740 190 826 190" fill="none" stroke="#3FA372" stroke-width="2.5"/>
    <!-- deep connectors: 재료비 -> 골조 -> 철근 -->
    <path d="M674 268 C700 268 668 300 684 300" fill="none" stroke="#1C7293" stroke-width="2"/>
    <path d="M816 300 L826 300" stroke="#1C7293" stroke-width="2"/>
    <path d="M674 268 C700 268 668 344 684 344" fill="none" stroke="#c0762a" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- nodes: 대분류 -->
    <rect x="542" y="172" width="132" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="554" y="194" font-size="12.5" font-weight="700" fill="#0F2A43">경비</text>
    <rect x="542" y="250" width="132" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="554" y="272" font-size="12.5" font-weight="700" fill="#0F2A43">재료비</text>
    <!-- 중분류 -->
    <rect x="684" y="282" width="132" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="696" y="304" font-size="12.5" fill="#0F2A43">골조</text>
    <rect x="684" y="326" width="132" height="36" rx="8" fill="#fff7f7" stroke="#f0a9a0" stroke-dasharray="4 3"/><text x="696" y="344" font-size="11.5" fill="#b03a2e">미연계</text><text x="748" y="344" font-size="11" fill="#0F2A43">잡자재</text>
    <!-- 품명 -->
    <rect x="826" y="172" width="150" height="36" rx="8" fill="#fff" stroke="#a9ddc0" stroke-width="1.5"/><text x="838" y="190" font-size="12.5" font-weight="600" fill="#0F2A43">이윤</text><text x="838" y="203" font-size="8.5" fill="#1e7d4f">잎 · 경비에 직접</text>
    <rect x="826" y="282" width="150" height="36" rx="8" fill="#fff" stroke="#a9ddc0"/><text x="838" y="304" font-size="12.5" font-weight="600" fill="#0F2A43">철근 SD400</text>

    <!-- notes -->
    <text x="546" y="392" font-size="11.5" fill="#1e7d4f">· 경비 &gt; 이윤 : 중간 없이 대분류에 직접(초록 실선)</text>
    <text x="546" y="412" font-size="11.5" fill="#1e7d4f">· 이윤 = 잎(품명 열)로 정확히 표기, 가짜 노드 0</text>
    <text x="546" y="432" font-size="11.5" fill="#0F2A43">· 깊은 항목(재료비 &gt; 골조 &gt; 철근)과 자연스럽게 공존</text>
    <text x="546" y="452" font-size="11.5" fill="#b03a2e">· "잡자재"는 형제(골조)엔 중분류 있는데 빠짐 → 미연계(누락 의심), 사람 확인</text>
  </g>

  <!-- bottom legend -->
  <rect x="24" y="562" width="972" height="42" rx="9" fill="#ffffff" stroke="#D8E3EA"/>
  <text x="40" y="588" font-size="11.5" fill="#0F2A43">범례:  <tspan fill="#3FA372" font-weight="800">━ 직접 연결(잎→상위 가지)</tspan>   ·   <tspan fill="#1C7293" font-weight="800">━ 일반 부모-자식</tspan>   ·   <tspan fill="#c0762a" font-weight="800">┄ 미연계(누락 의심, 사람 확인)</tspan>   ·   잎을 드래그해 대분류에 바로 드롭 = 대&gt;품목 직접</text>
</svg>
